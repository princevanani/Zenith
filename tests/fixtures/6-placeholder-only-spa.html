<!-- Mimics a modern React-style form with no <label>, just placeholders -->
<form id="spaForm">
  <input type="text" name="fullName" placeholder="Full Name" autocomplete="name">
  <input type="email" name="userEmail" placeholder="Email address" autocomplete="email">
  <input type="tel" name="userPhone" placeholder="Phone number" autocomplete="tel">
  <input type="text" name="city" placeholder="City">
  <input type="text" name="pincode" placeholder="PIN Code">
</form>
