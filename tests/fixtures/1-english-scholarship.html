<!-- Mimics classic table-based Indian govt scholarship portals (e.g. NSP) -->
<form id="scholarshipForm">
  <table>
    <tr><td>Applicant Name *</td><td><input type="text" name="appName" id="appName"></td></tr>
    <tr><td>Father's Name</td><td><input type="text" name="fname" id="fname"></td></tr>
    <tr><td>Mother's Name</td><td><input type="text" name="mname" id="mname"></td></tr>
    <tr><td>Date of Birth (DD/MM/YYYY)</td><td><input type="text" name="dob" id="dob"></td></tr>
    <tr><td>Gender</td><td>
      <select name="gender" id="gender"><option value="">Select</option><option>Male</option><option>Female</option></select>
    </td></tr>
    <tr><td>Category (General/OBC/SC/ST/EWS)</td><td>
      <select name="cat" id="cat"><option value="">Select</option><option>General</option><option>OBC</option><option>SC</option><option>ST</option><option>EWS</option></select>
    </td></tr>
    <tr><td>Aadhaar Number</td><td><input type="text" name="aadhaar" id="aadhaar" maxlength="12"></td></tr>
    <tr><td>Mobile Number</td><td><input type="text" name="mob" id="mob"></td></tr>
    <tr><td>Email ID</td><td><input type="email" name="email" id="email"></td></tr>
    <tr><td>Annual Family Income</td><td><input type="text" name="income" id="income"></td></tr>
    <tr><td>Bank Account Number</td><td><input type="text" name="acno" id="acno"></td></tr>
    <tr><td>IFSC Code</td><td><input type="text" name="ifsc" id="ifsc"></td></tr>
    <tr><td>10th Percentage</td><td><input type="text" name="tenthpct" id="tenthpct"></td></tr>
    <tr><td>12th Percentage</td><td><input type="text" name="twelfthpct" id="twelfthpct"></td></tr>
    <tr><td>State</td><td>
      <select name="state" id="state"><option value="">Select</option><option>Gujarat</option><option>Maharashtra</option></select>
    </td></tr>
    <tr><td>PIN Code</td><td><input type="text" name="pin" id="pin"></td></tr>
    <tr><td>Blood Group</td><td><input type="text" name="bg" id="bg"></td></tr>
  </table>
</form>
