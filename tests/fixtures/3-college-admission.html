<!-- Mimics a private college admission portal - different attribute naming convention -->
<form id="admissionForm">
  <div class="field"><label for="f1">Student Name</label><input type="text" id="f1" name="studentFullName"></div>
  <div class="field"><label for="f2">Guardian's Name</label><input type="text" id="f2" name="guardianFullName"></div>
  <div class="field"><label for="f3">Email Address</label><input type="email" id="f3" name="contactEmail"></div>
  <div class="field"><label for="f4">Contact Number</label><input type="tel" id="f4" name="contactNo"></div>
  <div class="field"><label for="f5">City/Town</label><input type="text" id="f5" name="cityTown"></div>
  <div class="field"><label for="f6">State</label><input type="text" id="f6" name="stateName"></div>
  <div class="field"><label for="f7">Course Name</label><input type="text" id="f7" name="courseSelected"></div>
  <div class="field"><label for="f8">Name of College Last Attended</label><input type="text" id="f8" name="prevCollege"></div>
  <div class="field"><label for="f9">12th Percentage</label><input type="text" id="f9" name="hscPct"></div>
  <div class="field"><label for="f10">PAN Card Number</label><input type="text" id="f10" name="panNo"></div>
</form>
