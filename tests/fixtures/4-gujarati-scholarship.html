<!-- Mimics a Gujarat state scholarship portal (MYSY-style), Gujarati labels -->
<form id="mysyForm">
  <table>
    <tr><td>વિદ્યાર્થીનું નામ</td><td><input type="text" name="vname" id="vname"></td></tr>
    <tr><td>પિતાનું નામ</td><td><input type="text" name="pname" id="pname"></td></tr>
    <tr><td>જન્મ તારીખ</td><td><input type="text" name="jdate" id="jdate"></td></tr>
    <tr><td>મોબાઈલ નંબર</td><td><input type="text" name="mno" id="mno"></td></tr>
    <tr><td>ઈમેલ</td><td><input type="email" name="eml" id="eml"></td></tr>
    <tr><td>સરનામું</td><td><textarea name="sadd" id="sadd"></textarea></td></tr>
    <tr><td>શહેર</td><td><input type="text" name="shr" id="shr"></td></tr>
    <tr><td>પિન કોડ</td><td><input type="text" name="pcode" id="pcode"></td></tr>
    <tr><td>પરિવારની વાર્ષિક આવક</td><td><input type="text" name="income" id="incomeg"></td></tr>
    <tr><td>કોલેજનું નામ</td><td><input type="text" name="clg" id="clg"></td></tr>
  </table>
</form>
