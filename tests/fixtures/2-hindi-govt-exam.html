<!-- Mimics a Hindi-language state govt exam application (label[for] based) -->
<form id="examForm">
  <div class="form-group">
    <label for="candName">अभ्यर्थी का नाम</label>
    <input type="text" id="candName" name="candName">
  </div>
  <div class="form-group">
    <label for="pName">पिता का नाम</label>
    <input type="text" id="pName" name="pName">
  </div>
  <div class="form-group">
    <label for="jTithi">जन्म तिथि</label>
    <input type="text" id="jTithi" name="jTithi">
  </div>
  <div class="form-group">
    <label for="mobNo">मोबाइल नंबर</label>
    <input type="text" id="mobNo" name="mobNo">
  </div>
  <div class="form-group">
    <label for="addr">पता</label>
    <textarea id="addr" name="addr"></textarea>
  </div>
  <div class="form-group">
    <label for="jati">जाति श्रेणी</label>
    <select id="jati" name="jati">
      <option value="">चुनें</option>
      <option>सामान्य</option>
      <option>ओबीसी</option>
      <option>एससी</option>
      <option>एसटी</option>
    </select>
  </div>
  <div class="form-group">
    <label for="rollNo">पंजीकरण संख्या</label>
    <input type="text" id="rollNo" name="rollNo">
  </div>
</form>
