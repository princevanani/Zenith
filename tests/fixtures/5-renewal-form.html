<!-- A different site entirely: "2nd year renewal" scholarship form.

     and includes "Blood Group" - a field NOT in the canonical dictionary,
     to exercise the auto-learn + cross-site fuzzy reuse path. -->
<form id="renewalForm">
  <label for="r1">Name of Student</label><input type="text" id="r1" name="student_name_field">
  <label for="r2">Father Name</label><input type="text" id="r2" name="fathername_field">
  <label for="r3">Blood Group</label><input type="text" id="r3" name="bg_field">
  <label for="r4">Mobile No.</label><input type="text" id="r4" name="mobile_field">
  <label for="r5">Email</label><input type="email" id="r5" name="email_field">
  <label for="r6">Institute Name</label><input type="text" id="r6" name="inst_field">
</form>
