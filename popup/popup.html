<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <span class="logo">⚡</span>
    <div>
      <h1>Zenith</h1>
      <p class="tagline">One profile. Every form.</p>
    </div>
  </header>

  <section id="statsBox" class="card">
    <div class="statRow">
      <span id="fillableCount">–</span>
      <span class="statLabel">fields on this page can be filled</span>
    </div>
  </section>

  <button id="autofillBtn" class="primary">Autofill this page</button>

  <section class="card">
    <div class="rowBetween">
      <span>Auto-save fields as I type</span>
      <label class="switch">
        <input type="checkbox" id="autoLearnToggle">
        <span class="slider"></span>
      </label>
    </div>
  </section>

  <button id="manageBtn" class="secondary">Manage my saved info</button>

  <footer>
    <span id="savedSummary">0 saved fields</span><br>
    <a href="./../privacy-policy.html" target="_blank">Privacy Policy</a>
    <a href="./../terms-and-conditions.html" target="_blank">Terms and Conditions</a>
    <a href="./../support.html" target="_blank">Support</a>
  </footer>

  <script src="popup.js"></script>
</body>
</html>
